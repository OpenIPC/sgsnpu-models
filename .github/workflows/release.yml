# Builds every model in models.txt from its pinned sources and publishes them
# as a release. Run by hand (Actions -> release -> Run workflow) and only that
# way: release assets are never uploaded from a workstation, so each one can be
# traced to the commit and run that built it.
#
# On the project's own runner, which has the vendor toolchain ($SGS_TOOLCHAIN):
# it may not be published (scripts/sdk.sh). The runner is registered for one job
# at a time (--ephemeral), by whoever runs the release, and no workflow here
# runs on a pull request.
name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create (e.g. v1). Must not exist yet.
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, sgsnpu]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Export dependencies
        run: |
          uv venv -q --clear --python 3.11 "$RUNNER_TEMP/venv"
          uv pip install -q --python "$RUNNER_TEMP/venv/bin/python" \
            --index-strategy unsafe-best-match -r requirements-export.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Build
        run: bash scripts/build.sh "$SGS_TOOLCHAIN" out

      # A detector built byte for byte as in the last release keeps its
      # operating points (reuse_points.sh): measuring them again is an hour of
      # simulating COCO val2017 for the same numbers.
      - name: Operating points
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prev=$(gh release list --limit 100 --json tagName --jq '.[].tagName' |
            grep -E '^v[0-9]+$' | sort -V | tail -1 || true)
          bash scripts/reuse_points.sh out "$prev"
          if [ -s out/points.todo ]; then
            bash scripts/fetch.sh coco.txt .cache/coco
            unzip -qo -d coco .cache/coco/val2017.zip
            unzip -qo -d coco .cache/coco/annotations_trainval2017.zip annotations/instances_val2017.json
          fi
          bash scripts/points.sh out coco/val2017 coco/annotations/instances_val2017.json 24

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          {
            echo "Built by run ${{ github.run_id }} from ${{ github.sha }}."
            echo
            echo "int8 (offline simulator) against FP32 on the eval images:"
            echo
            cat out/eval.md
            echo
            echo "The licence-plate models, int8 (offline simulator) against FP32 on"
            echo "synthetic plates:"
            echo
            cat out/lpr_eval.md
            echo
            echo "What each preset of majestic's object detection gets from these models"
            echo "(\`<model>.json\`, installed beside the model), int8 on COCO val2017:"
            echo
            cat out/points.md
          } > notes.md
          gh release create "$TAG" --target "${{ github.sha }}" --title "$TAG" \
            --notes-file notes.md out/*.img out/lpr_dec.bin out/yolov8n.json out/pvdn.json out/SHA256SUMS out/eval.md out/lpr_eval.md out/points.md
